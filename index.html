/* ── FLIPBOOK ENGINE ── */
html,body{width:100%;height:100%;overflow:hidden;background:#0f0f0f}
body{display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:'EB Garamond',serif}

#scene{perspective:2400px;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}

#book{
  position:relative;
  width:min(780px,92vw);
  height:min(90vh,900px);
  transform-style:preserve-3d;
}

/* shadow under book */
#book::after{
  content:'';
  position:absolute;
  bottom:-30px;left:8%;
  width:84%;height:40px;
  background:radial-gradient(ellipse,rgba(0,0,0,.55) 0%,transparent 70%);
  pointer-events:none;
}

.flip-card{
  position:absolute;
  inset:0;
  transform-origin:left center;
  transform-style:preserve-3d;
  transition:transform .72s cubic-bezier(.645,.045,.355,1.000);
  pointer-events:none;
}

.flip-card.active{ pointer-events:auto; }

.flip-front,.flip-back{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  overflow:hidden;
  border-radius:0 6px 6px 0;
  box-shadow:2px 0 18px rgba(0,0,0,.35);
}

.flip-front{ transform:rotateY(0deg); }
.flip-back { transform:rotateY(180deg); border-radius:6px 0 0 6px; box-shadow:-2px 0 18px rgba(0,0,0,.35); }

/* flipped state */
.flip-card.flipped{
  transform:rotateY(-180deg);
}

/* spine crease on front */
.flip-front::after{
  content:'';
  position:absolute;
  top:0;left:0;bottom:0;
  width:18px;
  background:linear-gradient(to right,rgba(0,0,0,.18),transparent);
  pointer-events:none;
  z-index:10;
}

/* page turn curl highlight */
.flip-card.turning .flip-front{
  background:linear-gradient(to right,#fff 0%,var(--ivory) 100%);
}

/* stacking z-indexes: unflipped pages stack front-to-back */
/* handled by JS */

/* ── NAVIGATION ── */
#nav{
  position:fixed;
  bottom:28px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:20px;
  z-index:999;
  background:rgba(30,42,56,.85);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  padding:12px 28px;
  border-radius:50px;
  border:1px solid rgba(200,169,106,.2);
  box-shadow:0 8px 40px rgba(0,0,0,.5);
}

#nav button{
  background:none;
  border:1px solid rgba(200,169,106,.4);
  color:var(--gold);
  font-family:'Cormorant Garamond',serif;
  font-size:22px;
  width:42px;height:42px;
  border-radius:50%;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .15s;
  line-height:1;
}
#nav button:hover{ background:rgba(200,169,106,.12); }
#nav button:active{ transform:scale(.93); }
#nav button:disabled{ opacity:.25; cursor:default; }

#page-counter{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  color:rgba(200,169,106,.7);
  font-size:15px;
  min-width:80px;
  text-align:center;
  letter-spacing:1px;
}

/* keyboard hint */
#hint{
  position:fixed;
  top:22px;
  left:50%;
  transform:translateX(-50%);
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  color:rgba(200,169,106,.45);
  font-size:13px;
  letter-spacing:2px;
  z-index:999;
  pointer-events:none;
  transition:opacity 1.5s;
}

/* progress thread */
#thread{
  position:fixed;
  top:0;left:0;
  height:2px;
  background:linear-gradient(to right,var(--burgundy),var(--rose));
  z-index:9999;
  transition:width .4s ease;
}

/* fit-to-page: no scrolling, content scales to fit */
.page,.confession,.reveal,.cover{
  height:100%;
  overflow:hidden;
}
/* inner scaler wrapper injected by JS */
.page-scaler{
  transform-origin: top left;
  width: 100%;
}

/* page-minimal needs flex centering */
.page-minimal{
  height:100%;
  overflow:hidden;
}

@media(max-width:600px){
  #book{width:98vw;height:96vh}
  .page{padding:40px 26px}
  .confession{padding:36px 26px}
  .page-num.left{left:26px}
  .page-num.right{right:26px}
  #nav{gap:12px;padding:10px 18px}
}

<script>
const PAGES = [
`<div class="cover">
<div class="cover-texture"></div>
<div class="cover-lines"></div>
<div class="red-string"></div>
<div class="cover-content">
<div class="cover-epigraph">A novella in ten movements</div>
<h1 class="cover-title">The <span>Geometry</span><br/>of Parallel Lines</h1>
<div class="cover-divider"></div>
<div class="cover-subtitle">
      These are the pages I wrote<br/>
      while waiting for you.
    </div>
<div class="cover-note">Written for her. Hidden from her. Until now.</div>
</div>
</div>`,
`<div class="page page-minimal page-minimal-dark">
<div class="center-quote center-quote-dark">
    "Before you read a single word of this—<br/>
    know that every word was already yours."
  </div>
</div>`,
`<div class="page page-cream">
<div class="movement-number">A note before we begin</div>
<h2 class="movement-title">To the reader<br/><em>who is the reason for this</em></h2>
<p class="body-text">This is not a novel. I want you to understand that from the very first page.</p>
<p class="body-text">Novels have characters with invented names. They have plots assembled from imagination—assembled to create feeling in strangers who will never know the author's face. Novels are generous fictions, offered outward.</p>
<p class="body-text">This is the opposite of that.</p>
<p class="body-text">This is a private thing that somehow became a book. These are pages written in margins, in notes apps at 2 a.m., in the backs of training manuals, in the quiet after discipline, when the only thing louder than exhaustion was the sound of your name moving through my mind without being spoken.</p>
<p class="body-text">I have been writing toward you for years. You never knew. That is perhaps the most honest sentence I have ever typed.</p>
<div class="poetic-line">
    You never knew you were being loved<br/>
    on pages you had never read.
  </div>
<p class="body-text">I've called you many things in these pages. I've called you <em>her</em>, and <em>the girl</em>, and <em>the one who chose my tie color</em>. I've called you a season. I've called you a particular quality of afternoon light that only exists in this specific small town, at this specific time of year, when the sun comes in sideways and makes everything gold and heartbreaking.</p>
<p class="body-text">I never used your name. Because using your name would have made this real in a way I wasn't ready for. Using your name would have meant you could find yourself on these pages. And I wasn't ready for that—not until I was.</p>
<p class="body-text">The last pages of this book use your name.</p>
<p class="body-text">I think by the time you reach them, you will understand why I waited until the end.</p>
<div class="ornament"></div>
<p class="body-text" style="text-align: right; font-style: italic; color: var(--text-mid); font-size: 16px;">— Him</p>
<span class="page-num right">ii</span>
</div>`,
`<div class="page page-minimal">
<div style="text-align:center">
<div class="movement-number">Movement I</div>
<div class="center-quote">Time Knows First</div>
</div>
</div>`,
`<div class="page">
<div class="movement-number">Movement I</div>
<h2 class="movement-title">Time Knows <em>First</em></h2>
<p class="body-text">There is a specific kind of knowing that arrives before you do.</p>
<p class="body-text">Before the moment registers in your conscious mind. Before your heart has named what it feels. Before language. There is a cellular knowing—something in the architecture of the body that rearranges itself quietly, without announcement, and only later, sometimes years later, do you understand what that rearrangement was preparing you for.</p>
<p class="body-text">I believe time knew about you long before I did.</p>
<p class="body-text">I believe the universe had been arranging this town—our town—as a kind of theater for years before we arrived in it. The streets were built with a specific geometry. The café on the corner was placed just so. The school was situated exactly where it needed to be, so that two people walking toward their own separate futures would have to pass through the same corridors, breathe the same chalk-and-rain air, hear the same bells mark the same hours of the same years.</p>
<p class="body-text">What I didn't know—what I couldn't have known—was that all of those years were a kind of rehearsal.</p>
<div class="string-visual">
<div class="string-knot" style="left: 20%;"></div>
<div class="string-knot" style="left: 80%;"></div>
</div>
<section-title class="section-title">Small town. Infinite distance.</section-title>
<p class="body-text">You need to understand something about small towns before this story makes sense. Small towns have a particular cruelty that large cities are too busy to inflict. In a city, you can spend your whole life three blocks from someone and never once occupy the same moment. No one expects you to have met them. No one raises an eyebrow.</p>
<p class="body-text">In a small town, the radius of encounter is so compressed that <em>not</em> meeting someone requires a kind of conspiracy. It requires the universe actively keeping two people apart. Every street corner is a potential intersection. Every shop has the same rotating cast. Every event draws from the same limited pool of human beings.</p>
<p class="body-text">Which means that for two people who grew up in the same zip code, who attended the same school, who have mutual friends and mutual memories of the same town rain and the same town festivals—for those two people to have spent years in a geography this small and still not truly met—</p>
<p class="body-text">—that is not accident.</p>
<p class="body-text">That is fate being theatrical.</p>
<div class="artifact">
<div class="artifact-label">From the pages, undated</div>
<div class="artifact-content">
      "I used to think our town was too small for destiny. <br/>
      Then I realized: it was too small for coincidence. <br/>
      Everything here is intentional. Including the waiting."
    </div>
</div>
<p class="body-text">Our town has two main roads that cross once in the center, near the old market. I learned later—after everything—that you used to walk one road on Tuesday mornings. I walked the other. We were always a perpendicular away from collision.</p>
<p class="body-text">Two lines, moving through the same small geometry, arriving at the intersection at different times.</p>
<p class="body-text">Parallel, except for that one crossing point we kept missing.</p>
<span class="page-num left">3</span>
</div>`,
`<div class="page">
<h3 class="section-title">What I knew before I knew I knew it</h3>
<p class="body-text">The first time I became aware of you—truly aware, not just the ambient awareness of someone who exists in the same social atmosphere—I couldn't have told you what I was feeling. I didn't have language for it yet.</p>
<p class="body-text">I remember noticing the way you moved through a crowded hallway. Not dramatically. Not the way people move in films, where the crowd parts and the light finds them and everyone else blurs. That is not what happened. What happened was smaller and therefore more permanent.</p>
<p class="body-text">You moved the way someone moves who is fully inside their own life. Not performing it. Not performing it for the hallway. You were simply going somewhere, thinking something, and the particular quality of your going was—</p>
<p class="body-text">It was like watching someone who had no idea they were being watched.</p>
<p class="body-text">That is rare. That is the rarest thing.</p>
<div class="poem">
<span class="poem-line">Some people move through a room like an announcement.</span>
<span class="poem-line">You moved through it like a morning—</span>
<span class="poem-line indent">unhurried,</span>
<span class="poem-line indent">specific,</span>
<span class="poem-line double-indent">entirely unconcerned with being beautiful.</span>
<span class="poem-line">That is the most beautiful thing.</span>
</div>
<p class="body-text">I filed the moment somewhere. I didn't label it. I didn't know yet that I was beginning to keep a ledger of you—each sighting, each overheard sentence, each almost-introduction that never quite arrived—adding up, compounding quietly in some interior account I didn't know was being kept.</p>
<p class="body-text">Time knew. My body knew. My conscious mind was the last to receive the information, and by then, it was already years too late to be objective about it.</p>
<div class="pull-quote">
<span>"In a town this small, destiny had no excuse.<br/>
    It took its time anyway."</span>
</div>
<span class="page-num right">4</span>
</div>`,

<div style="text-align:center">
<div class="movement-number" style="color: var(--gold);">Movement II</div>
<div class="center-quote center-quote-dark">The Farewell Colors</div>
<div style="margin-top: 20px; font-family: 'Playfair Display', serif; font-style: italic; font-size: 14px; color: var(--rose); opacity: 0.7;">
      — or, the day fabric became fate —
    </div>
</div>
</div>`,
`<div class="page page-dark">
<div class="movement-number">Movement II</div>
<h2 class="movement-title">The Farewell <em>Colors</em></h2>
<p class="body-text">It began with cloth.</p>
<p class="body-text">This is perhaps the most mundane origin story for a love that would consume years of a person's interior life. There was no dramatic declaration. No eye contact across a crowded room with swelling music. No moment so cinematic it practically named itself.</p>
<p class="body-text">There was cloth. There was a question. There was a color.</p>
<p class="body-text">And then there was everything after.</p>

<h3 class="section-title" style="border-color: var(--burgundy);">Farewell week. Last year of school.</h3>
<p class="body-text">You need to understand what farewell weeks mean in small towns. They are taken with enormous seriousness. Months of planning. The dress. The suit. The photographs that will become the only evidence, for some people, that they were once young and hopeful and standing in that particular configuration of people who would scatter across the country and never fully reassemble.</p>
<p class="body-text">Everyone cared deeply about what they were wearing. Not from vanity—or not only from vanity—but from some instinct that the outfit was a kind of announcement. That what you wore to your own goodbye said something true about who you were becoming.</p>
<p class="body-text">I had spent approximately no time thinking about my tie.</p>
<p class="body-text">I had a suit. I had a white shirt. I had a collection of ties I'd accumulated from various relatives and occasions, none of which I had chosen myself, all of which communicated nothing in particular about me.</p>
<p class="body-text">You were the one who changed that.</p>
<div class="sep sep-dark"></div>
<p class="body-text">The conversation didn't happen in a significant place. It happened in a corridor between classes—one of those institutional corridors where the light is always slightly exhausted and the floor is always slightly scuffed and time has a way of moving quickly and leaving almost no impression.</p>
<p class="body-text">You asked me, with the casual confidence of someone who asks questions like this all the time, what I thought of a particular shade of blue for your dress. You held up your phone—a photo, a fabric swatch image, the blue in question a kind of deep, quiet blue that I would later learn the word for: <em>cerulean</em>.</p>
<p class="body-text">I said: yes. Immediately. Without thinking. The word left my mouth before the question had fully landed.</p>
<p class="body-text">You laughed. You said I'd answered faster than anyone. You showed me two options, as if to clarify that I was supposed to be choosing.</p>
<p class="body-text">I said: still the first one.</p>

<h2 class="movement-title">Hallway <em>Silence</em></h2>
<p class="body-text">After school ended, I told myself the feeling would diminish. That's what feelings are supposed to do when the proximity is removed. You take someone out of the daily geography of your life, and they become, gradually, an abstraction—a memory that softens at the edges and loses its capacity to affect.</p>

<p class="body-text">By the time I fully understood what I was carrying, I had been carrying it for a year. By the time I named it, it had already named itself. By the time I found the correct word—</p>

<h3 class="section-title">The architecture of a hallway love</h3>
<p class="body-text">Let me tell you what I mean by a hallway love, because I think it matters for understanding everything that follows.</p>
<p class="body-text">A hallway love is not an obsession. I want to be clear about that. I have never been confused about the distinction. An obsession colonizes your interior life, crowds out everything else, becomes a compulsion that shapes every decision. What I had was not that.</p>
<p class="body-text">A hallway love is more like—a room in the house of yourself. A room that is always lit. A room you can walk into or walk away from, but that is always there, and always warm, and whose presence makes the whole house feel less empty.</p>
<p class="body-text">I built other things. I pursued ambitions. I made plans that had nothing to do with you. I trained. I disciplined myself. I became, in various measurable ways, a different and more capable person than the boy who bought a burgundy tie for his farewell.</p>

<h2 class="movement-title">Blue Light <em>Conversations</em></h2>
<p class="body-text">Here is what our love looked like from the outside, to anyone who might have been watching: it looked like nothing at all.</p>
<p class="body-text">It looked like an occasional message. A response, sometimes prompt, sometimes hours delayed. A conversation that picked up and set down with the comfortable rhythm of two people who had known each other long enough to not perform urgency.</p>
<p class="body-text">From the outside: nothing remarkable. Two people from the same town, from the same school year, maintaining the loose digital thread that the modern world offers as a substitute for proximity.</p>
<p class="body-text">From the inside—from my inside—it was everything.</p>
<div class="sep sep-dark"></div>
<h3 class="section-title" style="border-color: var(--burgundy);">What we talked about</h3>
<p class="body-text">We talked about things that mattered. That is the only honest way I can say it. We did not talk the way people talk when they are being careful with each other—the way you talk when you're managing an impression. We talked the way people talk when they've stopped worrying about the impression and started worrying about the truth.</p>
<p class="body-text">We talked about ambition. What it actually means to want something badly. Whether wanting is enough, or whether wanting must be disciplined into a kind of structure before it produces anything. You had opinions on this. Strong ones. You talked about discipline the way someone talks about a practice they have tested personally—not a theory but a finding.</p>

<h2 class="movement-title">Discipline <em>&amp; Distance</em></h2>
<p class="body-text">Military training teaches you many things about the body. It teaches you what the body is capable of when the mind has been convinced it is not. It teaches you that the relationship between endurance and desire is not linear—that wanting to stop is not the same as stopping, that the space between wanting and doing is where character actually lives.</p>
<p class="body-text">It also teaches you that discipline is not the absence of longing. This is what civilians tend to misunderstand. They think the disciplined person has somehow resolved their desires, subordinated them, replaced them with duty. But that is not how it works.</p>
<p class="body-text">The disciplined person feels everything. They have simply gotten very good at feeling it while still moving forward.</p>
<p class="body-text">I thought about you during training. Not obsessively. Not in a way that interfered. But in the way that a compass needle points, even when you're not looking at the compass—something in the deep magnetic system of me continuing to orient toward you, regardless of where I was pointed.</p>
<div class="ornament"></div>
<h3 class="section-title">What I was building while I waited</h3>
<p class="body-text">I want you to understand that the waiting was not passive. I think there's a version of this story where the waiting is a kind of failure—a man who was too afraid to act, suspended in inaction, letting years pass in a kind of romantic paralysis.</p>
<p class="body-text">That is not what happened.</p>
<p class="body-text">I was building something. Every year, I was building. The discipline of training. The work of ambition. The interior architecture that a person accumulates through difficulty and failure and the long grinding project of becoming someone you can respect.</p>
<p class="body-text">I think, honestly, I was building toward you. Not consciously. Not in the sense that I sat down and made a plan: <em>Become worthy of her. Then declare yourself.</em> It was more instinctive than that. More like: I knew that whatever I was going to bring to the door of this thing, I wanted it to be the best version available.</p>
<div class="artifact">
<div class="artifact-label">From the margins of a training manual</div>
<div class="artifact-content">

`<div class="page page-cream">
<h3 class="section-title">The fear beneath the discipline</h3>
<p class="body-text">Here is the fear, stated plainly, without the poetic softening I have given it everywhere else in these pages:</p>
<p class="body-text">I was afraid that if I showed up—physically showed up, stood in front of you, said the true thing—I would watch something shift in your face. A recalibration. The gentle, terrible work of your expression adjusting from what it had expected to what it was seeing.</p>
<p class="body-text">Because the text-self is curated. You have infinite time to choose the right word in a message. You have the editing function, the delete button, the reconsideration. The physical self arrives all at once, already committed to its entirety.</p>
<p class="body-text">I was afraid that you had fallen in love, a little, with the version of me that lived inside your phone. And that when you met the fuller version—the one with nervous hands and the tendency to go quiet when he feels things too clearly—you would find that the full version was less than you'd imagined.</p>
<p class="body-text">This fear is not rational. I know that now. But fears are not required to be rational in order to be effective.</p>
<p class="body-text">They are only required to be believed. And I believed this one completely, for years.</p>

<span class="poem-line">Beneath all the discipline,</span>

<span class="poem-line"> </span>

<div class="movement-number">Movement VII</div>
<h2 class="movement-title">The Art <em>of Waiting</em></h2>
<p class="body-text">Waiting is not, as most people practice it, the same as doing nothing. Waiting is active when done correctly. Waiting is a discipline, a cultivation, a deliberate maintenance of something precious against the erosion of time and doubt and the ten thousand ordinary reasons that the world provides for giving up on the things you love.</p>
<p class="body-text">I became an expert. I am not proud of this in the way that competence usually makes a person proud. But I am at peace with it. I waited the way someone waits for a storm to pass when they have excellent reasons to know the storm will pass—not with resignation, but with a foundational trust in the direction of things.</p>
<div class="sep sep-dark"></div>
<h3 class="section-title" style="border-color: var(--burgundy);">What waiting looks like from inside</h3>
<p class="body-text">From inside, the waiting looked like this:</p>
<p class="body-text">It looked like Tuesday mornings in the same town, living my life, building the things I intended to build, and always, in the peripheral vision of the heart, maintaining a quiet orientation toward you.</p>

<p class="body-text">I am finishing this book because it needs to be finished. Because the story it tells has an ending, and the ending is not a literary resolution—it is a real life, which is something far better and stranger and less tidy than any literary ending I could construct.</p>
<p class="body-text">We are not a parallel lines anymore. We are not a near miss or an unsent message or a draft confession or an almost. We are an actual, specific, ongoing thing that happens in real time in a real place with real logistics and real disagreements and real mornings and the particular extraordinary ordinariness of a love that has finally been permitted to be ordinary.</p>
<p class="body-text">We are intersecting lines. Which is to say: we are no longer a geometry problem. We are simply two people, in the same town, finally in the same room, finally with the same timing.</p>
<div class="poem">
<span class="poem-line">After all the geometry—</span>
<span class="poem-line">after the parallel lines</span>
<span class="poem-line indent">and the near misses</span>
<span class="poem-line indent">and the nine seconds</span>
<span class="poem-line indent">and the festival in the rain—</span>
<span class="poem-line"> </span>
<span class="poem-line">we intersected.</span>
<span class="poem-line"> </span>
<span class="poem-line">And intersection</span>
<span class="poem-line indent">is just the mathematical word</span>
<span class="poem-line double-indent">for the moment two lines</span>
<span class="poem-line double-indent">decide to share a point.</span>
<span class="poem-line"> </span>
<span class="poem-line">We are sharing a point.</span>
<span class="poem-line">We are sharing many.</span>
<span class="poem-line">We will share more.</span>
</div>
<div class="sep sep-dark"></div>
<p class="body-text" style="text-align: center; font-style: italic; color: rgba(248,243,237,0.5); font-size: 15px; letter-spacing: 1px; padding: 20px 0;">
    Zara—<br/>
<br/>
    this is your book.<br/>
    it always was.<br/>
<br/>
    I love you.<br/>
<br/>
    I loved you first in hallways<br/>
    where echoes knew my name.<br/>
    I love you now in every room<br/>
    we choose to enter together.
  </p>

const book = document.getElementById('book');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const counter = document.getElementById('page-counter');
const thread  = document.getElementById('thread');
const hint    = document.getElementById('hint');
const total   = PAGES.length;

// Build cards: card i shows page[i] on front, page[i+1] on back (if exists)
// We use single-sided cards — one card per page for simplicity & reliability
const cards = [];

PAGES.forEach((html, i) => {
  const card = document.createElement('div');
  card.className = 'flip-card';
  card.dataset.index = i;

  const front = document.createElement('div');
  front.className = 'flip-front';
  front.innerHTML = html;

  card.appendChild(front);
  book.appendChild(card);
  cards.push(card);
});

let current = 0; // currently visible page index

function updateZIndexes() {
  cards.forEach((c, i) => {
    if (i < current) {
      // already turned: behind, high z so they're "left page stack"
      c.style.zIndex = i;
      c.classList.add('flipped');
    } else if (i === current) {
      c.style.zIndex = total + 10;
      c.classList.remove('flipped');
    } else {
      // upcoming pages: stacked behind current, descending z
      c.style.zIndex = total - i;
      c.classList.remove('flipped');
    }
    c.classList.toggle('active', i === current);
  });
}

function goTo(idx, animate = true) {
  if (idx < 0 || idx >= total) return;

  if (!animate) {
    current = idx;
    updateZIndexes();
    updateUI();
    return;
  }

  if (idx > current) {
    // turning forward: flip current card away
    const card = cards[current];
    card.classList.add('flipped');
    setTimeout(() => {
      current = idx;
      updateZIndexes();
      updateUI();
    }, 360);
  } else {
    // turning backward: un-flip the card at idx
    current = idx;
    updateZIndexes();
    setTimeout(updateUI, 360);
  }
  updateUI();
}

function updateUI() {
  counter.textContent = (current + 1) + ' / ' + total;
  btnPrev.disabled = current === 0;
  btnNext.disabled = current === total - 1;
  thread.style.width = Math.round((current / (total - 1)) * 100) + '%';
}

// Init
updateZIndexes();
updateUI();

// ── AUTO-SCALE: shrink page content to fit without scrolling ──
function scalePages() {
  cards.forEach(card => {
    const pageEl = card.querySelector('.flip-front > div');
    if (!pageEl) return;

    // Skip pages that are already flex-centered (page-minimal, cover)
    const isMinimal = pageEl.classList.contains('page-minimal') ||
                      pageEl.classList.contains('cover');
    if (isMinimal) return;

    // Reset any previous scale
    pageEl.style.transform = '';
    pageEl.style.height = '100%';

    const containerH = card.offsetHeight;
    const contentH   = pageEl.scrollHeight;

    if (contentH > containerH) {
      const scale = containerH / contentH;
      pageEl.style.transformOrigin = 'top left';
      pageEl.style.transform = `scale(${scale})`;
      pageEl.style.width     = (100 / scale) + '%';
      pageEl.style.height    = (100 / scale) + '%';
    }
  });
}

// Run after fonts load & on resize
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => { setTimeout(scalePages, 100); });
} else {
  window.addEventListener('load', () => setTimeout(scalePages, 100));
}
window.addEventListener('resize', scalePages);

// Fade hint after 4s
setTimeout(() => { hint.style.opacity = '0'; }, 4000);

btnNext.addEventListener('click', () => goTo(current + 1));
btnPrev.addEventListener('click', () => goTo(current - 1));

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(current + 1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   goTo(current - 1);
});

// Swipe support
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) dx < 0 ? goTo(current+1) : goTo(current-1);
}, {passive:true});
</script>
